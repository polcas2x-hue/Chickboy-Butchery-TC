project_id = "chickboy-training-center"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false

# These functions implement their own auth (custom sessions table, see
# supabase/migrations/0008_auth_sessions.sql) rather than Supabase's native
# JWT auth, so the platform's default "require a Supabase JWT" gate is
# turned off for them — login/session-info/logout/change-password ARE the
# auth layer, called with only the publishable key.
[functions.login]
verify_jwt = false

[functions.logout]
verify_jwt = false

[functions."session-info"]
verify_jwt = false

[functions."change-password"]
verify_jwt = false

# Applications phase — same reasoning. submit-application/get-municipalities/
# get-barangays are public (no login required, matching Code.gs); the rest
# check the custom session token themselves via _shared/session.ts.
[functions."submit-application"]
verify_jwt = false

[functions."update-application-status"]
verify_jwt = false

[functions."get-applications"]
verify_jwt = false

[functions."upload-requirement-document"]
verify_jwt = false

[functions."get-document-url"]
verify_jwt = false

[functions."get-municipalities"]
verify_jwt = false

[functions."get-barangays"]
verify_jwt = false

# Schedule phase — same reasoning as above.
[functions."get-schedule"]
verify_jwt = false

[functions."add-schedule-entry"]
verify_jwt = false

[functions."update-schedule-entry"]
verify_jwt = false

[functions."approve-schedule-entry"]
verify_jwt = false

[functions."delete-schedule-entry"]
verify_jwt = false

[functions."get-open-batches"]
verify_jwt = false

# User Management phase — same reasoning as above.
[functions."admin-create-user"]
verify_jwt = false

[functions."admin-update-user"]
verify_jwt = false

[functions."admin-delete-user"]
verify_jwt = false

[functions."get-users"]
verify_jwt = false

[functions."get-user-log"]
verify_jwt = false
